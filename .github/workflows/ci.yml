name: CI/CD

on:
  push:
    branches: [devlop,main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build e test
        run: ./mvnw -B verify